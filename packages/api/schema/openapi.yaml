openapi: 3.0.3
info:
  title: Campus & Clubs API
  version: 1.0.0
  description: Campus & Clubs Backend API
paths:
  /api/accounts/auth/{user_id}/all/:
    get:
      operationId: accounts_auth_all_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: accounts_auth_all_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: accounts_auth_all_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/auth/{user_id}/posts/:
    get:
      operationId: accounts_auth_posts_retrieve
      description: |-
        Get all posts created by a user (both user posts and club posts)
        Query params:
        - source: all|user|club (default: all)
        - post_type: TEXT|IMAGE|VIDEO (default: all)
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/auth/all/:
    get:
      operationId: list_users
      description: Returns a paginated list of users.
      summary: List users
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
        description: Sort field, e.g. `-date_joined`, `username`.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by username, first name, or last name.
      tags:
      - Users
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserProfileList'
          description: Paginated list of users.
        '401':
          description: Unauthorized.
    post:
      operationId: list_users_2
      description: Returns a paginated list of users.
      summary: List users
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
        description: Sort field, e.g. `-date_joined`, `username`.
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: search
        schema:
          type: string
        description: Search by username, first name, or last name.
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMinimalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserMinimalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserMinimalRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserProfileList'
          description: Paginated list of users.
        '401':
          description: Unauthorized.
  /api/accounts/auth/jwt/create/:
    post:
      operationId: accounts_auth_jwt_create_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/accounts/auth/jwt/refresh/:
    post:
      operationId: accounts_auth_jwt_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
          description: ''
  /api/accounts/auth/jwt/verify/:
    post:
      operationId: accounts_auth_jwt_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/accounts/auth/login/:
    post:
      operationId: login
      description: Authenticates a user with email or username and returns tokens.
      summary: Log in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
            examples:
              BasicLogin:
                value:
                  username_or_email: asha@example.com
                  password: s3cret!
                summary: Basic login
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: Login succeeded.
        '401':
          description: Invalid credentials.
  /api/accounts/auth/logout/:
    post:
      operationId: accounts_auth_logout_create
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/auth/me/:
    get:
      operationId: accounts_auth_me_retrieve
      description: Get current authenticated user's profile
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/auth/me/affiliations/:
    get:
      operationId: get_my_affiliations
      description: Returns every InstituteAffiliate row owned by the authenticated
        user, with the affiliated institute inlined.
      summary: List current user's institute affiliations
      tags:
      - Users · Me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstituteAffiliateForUser'
          description: The authenticated user's affiliations.
        '401':
          description: Unauthorized.
  /api/accounts/auth/me/emails/:
    get:
      operationId: get_my_emails
      description: Returns the allauth EmailAddress rows belonging to the authenticated
        user. Used to populate the email selector on the affiliation-claim form.
      summary: List current user's email addresses
      tags:
      - Users · Me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserEmail'
          description: The authenticated user's emails.
        '401':
          description: Unauthorized.
  /api/accounts/auth/refresh/:
