          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserMinimalRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMinimal'
          description: ''
    delete:
      operationId: accounts_auth_users_destroy
      parameters:
      - in: path
        name: id
