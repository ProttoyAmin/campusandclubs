  /api/activities/comments/:
    get:
      operationId: activities_comments_retrieve
      description: |-
        Get all comments for a specific content object
        Query params:
        - content_type: app_label.model_name
        - object_id: ID of the object
        - parent: (optional) ID of parent comment for nested replies

        Example: /api/v1/activities/comments/?content_type=clubs.clubpost&object_id=123
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/comments/{comment_id}/:
    get:
      operationId: activities_comments_retrieve_2
      description: |-
        Get, update, or delete a specific comment
        - GET: Anyone can view
        - PATCH: Only author can edit
        - DELETE: Author can delete
      parameters:
      - in: path
        name: comment_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
