scripts:
  superuser: cd backend/api && uv run python manage.py createsuperuser

  backend:check: cd backend/api && uv run python manage.py check
  backend:shell: cd backend/api && uv run python manage.py shell

  backend:migrations: cd backend/api && uv run python manage.py makemigrations
  backend:build:migrations: cd backend/api && $env:DEBUG="False"; uv run python manage.py makemigrations
  backend:migrate: cd backend/api && uv run python manage.py migrate
  backend:build:migrate: cd backend/api && $env:DEBUG="False"; uv run python manage.py migrate
  backend:server: cd backend/api && uv run python manage.py runserver localhost:8000
  backend:schema: cd backend/api && uv run python manage.py spectacular --file ../../packages/api/schema/openapi.yaml

  web:dev: pnpm --filter web dev
  web:generate: pnpm --filter @campus/api generate
  web:build: pnpm -r build
  web:start: pnpm --filter web start

  web:v1:dev: pnpm --filter @campusandclubs/web-v1 dev
